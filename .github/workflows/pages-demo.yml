# WaifuDesk — demo web GitHub Pages.
# Deploy hanya berjalan jika dipicu manual pada branch main.
# Tidak menjalankan Tauri/Rust, dan tidak mengakses data Codex lokal.
name: WaifuDesk Web Demo

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waifudesk-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and publish web preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run quality gates
        run: npm run verify

      - name: Build GitHub Pages preview
        run: npm exec -- vite build --base /waifu-desk/

      - name: Check asset paths and output
        run: node scripts/check-pages-build.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Publish web demo
        id: deployment
        uses: actions/deploy-pages@v5
