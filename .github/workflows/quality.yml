
name: WaifuDesk Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, format, build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Check architecture
        run: node scripts/check-architecture.mjs

  rust:
    name: Rust Axum and Tauri
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Rust Axum
      - name: Check Axum formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Test Axum API
        run: cargo test --manifest-path server/Cargo.toml --locked

      - name: Check Axum Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings

      # Gunakan script yang sama dengan development lokal
      - name: Prepare Rust API sidecar
        run: node scripts/prepare-sidecar.mjs

      - name: Verify sidecar binary
        shell: pwsh
        run: |
          $targetTriple = (rustc --print host-tuple).Trim()
          $binary = "src-tauri/binaries/waifudesk-api-$targetTriple.exe"

          if (-not (Test-Path $binary)) {
            throw "Sidecar binary tidak ditemukan: $binary"
          }

          Write-Host "Sidecar ready: $binary"

      # Rust Tauri
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Tauri Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
