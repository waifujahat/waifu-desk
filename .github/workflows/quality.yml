
name: WaifuDesk Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, format, build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend
        run: npm run verify

      - name: Check architecture
        run: node scripts/check-architecture.mjs

  rust:
    name: Rust Axum and Tauri
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Backend Axum
      - name: Check Axum formatting
        run: cargo fmt --manifest-path server/Cargo.toml --all -- --check

      - name: Test Axum API
        run: cargo test --manifest-path server/Cargo.toml --locked

      - name: Check Axum Clippy
        run: cargo clippy --manifest-path server/Cargo.toml --all-targets --locked -- -D warnings

      # Siapkan executable sidecar untuk Tauri
      - name: Build Rust API sidecar
        run: cargo build --manifest-path server/Cargo.toml --locked

      - name: Prepare Tauri sidecar binary
        shell: pwsh
        run: |
          $targetTriple = (rustc --print host-tuple).Trim()
          $destination = "src-tauri/binaries/waifudesk-api-$targetTriple.exe"

          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null

          Copy-Item "server/target/debug/server.exe" $destination -Force

          if (-not (Test-Path $destination)) {
            throw "Rust API sidecar binary not found"
          }

          Write-Host "Sidecar ready: $destination"

      # Desktop Tauri
      - name: Check Tauri formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Tauri
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Check Tauri Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
